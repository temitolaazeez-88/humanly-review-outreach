<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanly Review</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://checkout.flutterwave.com/v3.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand" data-site-name>Humanly Review</a>
  <a href="help.html" class="help-pill">Need help?</a>
</div>

<div class="wrap" id="app"></div>

<footer>
  <span data-site-name>Humanly Review</span> · Your document is kept private and only stored after payment succeeds.
  · <a href="help.html">Support</a>
</footer>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const STATE_KEY = 'hr_customer_state';
const state = Object.assign({
  step: 'landing', email: '', sessionToken: '', orderRef: '',
  plan: null, wordCount: 0, imageCount: 0, fileSizeMB: 0,
  fileBase64: '', fileName: '', otpExpiresAt: 0, resendReadyAt: 0
}, hrLoadState(STATE_KEY) || {});

let siteSettings = {};
const app = document.getElementById('app');
const STEPS = ['email','otp','upload','plan','payment','submitted'];
let pollTimer = null;

function persist() { hrSaveState(STATE_KEY, state); }
function goTo(step) { state.step = step; persist(); render(); }

function stepDots(current) {
  const idx = STEPS.indexOf(current);
  return '<div class="steps">' + STEPS.map(function(s,i){ return '<div class="step-dot ' + (i <= idx ? 'done' : '') + '"></div>'; }).join('') + '</div>';
}

function render() {
  const trackOrder = hrGetParam('order');
  if (hrGetParam('view') === 'track' && trackOrder) return renderTracking(trackOrder);
  switch (state.step) {
    case 'landing': return renderLanding();
    case 'email': return renderEmail();
    case 'otp': return renderOtp();
    case 'upload': return renderUpload();
    case 'oversized': return renderOversized();
    case 'plan': return renderPlan();
    case 'payment': return renderPayment();
    case 'submitted': return renderSubmitted();
  }
}

/* ---------------- Landing (plans, samples, video — requirements #17 #18) ---------------- */
async function renderLanding() {
  app.innerHTML = '<div class="card center"><p class="muted">Loading…</p></div>';
  let plansHtml = '', videoHtml = '', samplesHtml = '';
  try {
    const plansRes = await hrCall('getPlans', {});
    const plans = plansRes.plans;
    plansHtml = '<div class="plans-grid">' + plans.map(function(p, i) {
      return '<div class="plan-card ' + (i === Math.floor(plans.length/2) ? 'featured' : '') + '">' +
        (i === Math.floor(plans.length/2) ? '<span class="tag">Most popular</span>' : '') +
        '<h3>' + hrEscape(p.name) + '</h3>' +
        '<div class="price">' + p.currency + ' ' + Number(p.price).toLocaleString() + '<small> / document</small></div>' +
        '<ul><li>Up to ' + p.maxSizeMB + 'MB documents</li><li>Delivered within ~' + p.deliveryHours + ' hours</li><li>Secure, private, auto-deleted after delivery</li></ul>' +
      '</div>';
    }).join('') + '</div>';
  } catch (e) {}
  if (siteSettings.how_it_works_video_url) {
    videoHtml = '<div class="card"><h2>How it works</h2>' + embedVideo_(siteSettings.how_it_works_video_url) + '</div>';
  }
  try {
    const samplesRes = await hrCall('getSamples', {});
    if (samplesRes.samples.length) {
      samplesHtml = '<div class="card"><h2>Sample reports</h2><p class="sub">Preview a sample before you start — nothing to sign up for.</p>' +
        samplesRes.samples.map(function(s) {
          return '<div class="sample-card"><div class="thumb">📄</div><div style="flex:1;"><strong>' + hrEscape(s.Title) + '</strong>' +
            '<p class="muted" style="margin:4px 0;">' + hrEscape(s.Description) + '</p>' +
            (s.PreviewFileId ? '<a class="btn small secondary" href="https://drive.google.com/file/d/' + s.PreviewFileId + '/preview" target="_blank">Preview</a>' : '') + '</div></div>';
        }).join('') + '</div>';
    }
  } catch (e) {}

  app.innerHTML =
    '<div class="card center">' +
      '<h1 data-hero-title>Find the academic problems others may miss.</h1>' +
      '<p class="sub" data-hero-subtitle>Upload your document. Get a professional review, delivered securely.</p>' +
      '<button class="btn" id="startBtn" data-cta-text>Get My Review →</button>' +
    '</div>' +
    '<div class="card"><h2>Plans</h2><p class="sub">Matched automatically by your document\'s file size — no guessing.</p>' + plansHtml +
      '<p class="center muted" style="margin-top:14px;">Have a document larger than these plans? <a href="#" id="enterpriseLink">Contact us for an Enterprise quote →</a></p>' +
    '</div>' +
    videoHtml + samplesHtml;

  document.getElementById('startBtn').onclick = function() { goTo('email'); };
  const entLink = document.getElementById('enterpriseLink');
  if (entLink) entLink.onclick = function(e) { e.preventDefault(); window.location.href = 'help.html?enterprise=1'; };
}

function embedVideo_(url) {
  let embed = url;
  const yt = url.match(/(?:youtu\.be\/|v=)([\w-]{11})/);
  if (yt) embed = 'https://www.youtube.com/embed/' + yt[1];
  return '<div class="video-embed"><iframe src="' + embed + '" allowfullscreen></iframe></div>';
}

/* ---------------- Email entry (with back-safe flow) ---------------- */
function renderEmail() {
  app.innerHTML =
    '<div class="card">' + stepDots('email') +
      '<h2>What\'s your email address?</h2>' +
      '<p class="sub">We\'ll send you a one-time 6-digit code — no password needed.</p>' +
      '<div id="msg"></div>' +
      '<input type="email" id="emailInput" value="' + hrEscape(state.email) + '" placeholder="you@example.com" autocomplete="email">' +
      '<button class="btn" id="continueBtn" style="margin-top:10px;">Continue →</button>' +
      (siteSettings.google_client_id ? '<p class="center muted" style="margin:14px 0;">— or —</p><div id="googleBtn" style="display:flex;justify-content:center;"></div>' : '') +
      '<p class="center" style="margin-top:16px;"><a href="#" id="backBtn">← Back</a></p>' +
    '</div>';

  document.getElementById('backBtn').onclick = function(e) { e.preventDefault(); goTo('landing'); };

  document.getElementById('continueBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const email = document.getElementById('emailInput').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Sending code…';
    try {
      const res = await hrCall('sendOtp', { email: email });
      state.email = email; state.otpExpiresAt = Date.now() + res.expiresInSeconds * 1000;
      state.resendReadyAt = Date.now() + res.resendCooldownSeconds * 1000;
      goTo('otp');
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Continue →'; }
  };

  if (siteSettings.google_client_id && window.google && window.google.accounts) {
    try {
      google.accounts.id.initialize({ client_id: siteSettings.google_client_id, callback: onGoogleSignIn_ });
      google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' });
    } catch (e) {}
  }
}

async function onGoogleSignIn_(response) {
  try {
    const res = await hrCall('googleSignIn', { idToken: response.credential });
    state.email = res.email; state.sessionToken = res.sessionToken;
    goTo('upload');
  } catch (e) { alert(e.message); }
}

/* ---------------- OTP verification (with live countdown — requirement #3) ---------------- */
function renderOtp() {
  app.innerHTML =
    '<div class="card">' + stepDots('otp') +
      '<h2>Enter your 6-digit code</h2>' +
      '<p class="sub">We sent a code to <strong>' + hrEscape(state.email) + '</strong>.</p>' +
      '<div id="msg"></div>' +
      '<input type="text" id="codeInput" placeholder="123456" maxlength="6" inputmode="numeric">' +
      '<p class="muted center">Code expires in <span id="expiryCountdown">--:--</span></p>' +
      '<button class="btn" id="verifyBtn" style="margin-top:6px;">Verify →</button>' +
      '<p class="muted center" style="margin-top:14px;">' +
        '<a href="#" id="resendLink">Resend code</a> <span id="resendCountdown"></span> · <a href="#" id="backLink">Change email</a>' +
      '</p>' +
    '</div>';

  const expiryEl = document.getElementById('expiryCountdown');
  const remainingExpiry = Math.max(0, Math.round((state.otpExpiresAt - Date.now()) / 1000));
  hrStartCountdown(expiryEl, remainingExpiry, function() { expiryEl.innerText = 'expired'; });

  const resendLink = document.getElementById('resendLink');
  const resendCountdownEl = document.getElementById('resendCountdown');
  function armResend() {
    const remainingResend = Math.max(0, Math.round((state.resendReadyAt - Date.now()) / 1000));
    if (remainingResend > 0) {
      resendLink.style.pointerEvents = 'none'; resendLink.style.opacity = '.5';
      hrStartCountdown(resendCountdownEl, remainingResend, function() { resendCountdownEl.innerText = ''; resendLink.style.pointerEvents = ''; resendLink.style.opacity = ''; });
    }
  }
  armResend();

  document.getElementById('backLink').onclick = function(e){ e.preventDefault(); goTo('email'); };
  resendLink.onclick = async function(e){
    e.preventDefault();
    try {
      const res = await hrCall('sendOtp', { email: state.email });
      state.otpExpiresAt = Date.now() + res.expiresInSeconds * 1000;
      state.resendReadyAt = Date.now() + res.resendCooldownSeconds * 1000;
      persist();
      hrShowSuccess(document.getElementById('msg'), 'A new code has been sent.');
      hrStartCountdown(expiryEl, res.expiresInSeconds);
      armResend();
    } catch (err) { hrShowError(document.getElementById('msg'), err.message); }
  };

  document.getElementById('verifyBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const code = document.getElementById('codeInput').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…';
    try {
      const res = await hrCall('verifyOtp', { email: state.email, code: code });
      state.sessionToken = res.sessionToken;
      goTo('upload');
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Verify →'; }
  };
}

/* ---------------- Document upload (analysis only — NO Drive write yet, req #5) ---------------- */
function renderUpload() {
  app.innerHTML =
    '<div class="card">' + stepDots('upload') +
      '<h2>Upload your academic work</h2>' +
      '<p class="sub">Accepted formats: DOCX, TXT. Your plan is matched by file size only.</p>' +
      '<div id="msg"></div>' +
      '<input type="file" id="fileInput" accept=".docx,.txt">' +
      '<p class="help">Nothing is saved anywhere until your payment is confirmed — you can safely leave and come back.</p>' +
      '<button class="btn" id="uploadBtn" style="margin-top:10px;">Continue →</button>' +
      '<p class="center" style="margin-top:16px;"><a href="#" id="backBtn">← Back</a></p>' +
    '</div>';

  document.getElementById('backBtn').onclick = function(e) { e.preventDefault(); goTo('otp'); };

  document.getElementById('uploadBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const fileEl = document.getElementById('fileInput');
    let file = fileEl.files[0];
    if (!file && state.fileBase64) {
      // Resuming a session where the file was already picked before a refresh.
    } else if (!file) { hrShowError(msg, 'Please choose a file first.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking your document…';
    try {
      const base64 = file ? await fileToBase64(file) : state.fileBase64;
      const fileName = file ? file.name : state.fileName;
      const res = await hrCall('analyzeDocument', { sessionToken: state.sessionToken, fileName: fileName, fileBase64: base64 });
      state.fileBase64 = base64; state.fileName = fileName;
      if (res.oversized) {
        state.oversizeCode = res.oversizeCode; state.fileSizeMB = res.fileSizeMB;
        goTo('oversized'); return;
      }
      state.orderRef = res.orderRef; state.plan = res.plan;
      state.wordCount = res.wordCount; state.imageCount = res.imageCount; state.fileSizeMB = res.fileSizeMB;
      goTo('plan');
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Continue →'; }
  };
}

/* ---------------- Oversized / enterprise handoff (requirement #23) ---------------- */
function renderOversized() {
  app.innerHTML =
    '<div class="card center">' +
      '<h2>Your document needs a custom quote</h2>' +
      '<p class="sub">At ' + state.fileSizeMB + 'MB, this is larger than our standard plans. We\'ve already opened a request for you — no need to type anything.</p>' +
      '<p class="muted">Your request code:</p>' +
      '<div class="ref-number" id="oversizeRefBox">' + hrEscape(state.oversizeCode) + ' 📋</div>' +
      '<div class="copy-toast" id="copyToast"></div>' +
      '<p class="sub" style="margin-top:16px;">We\'ll email <strong>' + hrEscape(state.email) + '</strong> a custom price shortly. You won\'t be charged and no file has been stored.</p>' +
      '<a class="btn secondary" href="help.html?ticketRef=' + encodeURIComponent(state.oversizeCode) + '&locked=1">View this request in Support →</a>' +
    '</div>';
  document.getElementById('oversizeRefBox').onclick = function() { hrCopyToClipboard(state.oversizeCode, document.getElementById('copyToast')); };
}

/* ---------------- Plan match result ---------------- */
function renderPlan() {
  app.innerHTML =
    '<div class="card">' + stepDots('plan') +
      '<h2>' + hrEscape(state.plan.name) + ' — Eligible ✓</h2>' +
      '<ul class="checklist">' +
        '<li><span>File size</span><span>' + state.fileSizeMB + ' MB</span></li>' +
        '<li><span>Word count</span><span>' + state.wordCount + ' (reference only)</span></li>' +
        '<li><span>Images</span><span>' + state.imageCount + '</span></li>' +
        '<li><span>Price</span><span><strong>' + state.plan.currency + ' ' + Number(state.plan.price).toLocaleString() + '</strong></span></li>' +
      '</ul>' +
      '<button class="btn" id="payBtn">Continue to payment →</button>' +
      '<p class="center" style="margin-top:16px;"><a href="#" id="backBtn">← Choose a different file</a></p>' +
    '</div>';
  document.getElementById('payBtn').onclick = function() { goTo('payment'); };
  document.getElementById('backBtn').onclick = function(e) { e.preventDefault(); goTo('upload'); };
}

/* ---------------- Payment (auto-continues on success — requirement #7) ---------------- */
function renderPayment() {
  app.innerHTML =
    '<div class="card">' + stepDots('payment') +
      '<h2>Order summary</h2>' +
      '<ul class="checklist">' +
        '<li><span>Reference</span><span>' + hrEscape(state.orderRef) + '</span></li>' +
        '<li><span>Plan</span><span>' + hrEscape(state.plan.name) + '</span></li>' +
        '<li><span>Total</span><span><strong>' + state.plan.currency + ' ' + Number(state.plan.price).toLocaleString() + '</strong></span></li>' +
      '</ul>' +
      '<div id="msg"></div>' +
      '<button class="btn" id="payNowBtn">Pay securely →</button>' +
      '<p class="muted center" style="margin-top:10px;">Closing this page never loses your progress — come back any time to finish payment.</p>' +
      '<p class="center" style="margin-top:16px;"><a href="#" id="backBtn">← Back</a></p>' +
    '</div>';
  document.getElementById('backBtn').onclick = function(e) { e.preventDefault(); goTo('plan'); };

  // Poll in case an admin manually approves/waives this payment while we wait.
  pollTimer = setInterval(async function() {
    try {
      const s = await hrCall('getOrderStatus', { orderRef: state.orderRef });
      if (s.paymentStatus === 'confirmed') { clearInterval(pollTimer); await finalizeAndAdvance_(); }
    } catch (e) {}
  }, 4000);

  document.getElementById('payNowBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Preparing payment…';
    try {
      const init = await hrCall('initPayment', { sessionToken: state.sessionToken, orderRef: state.orderRef });
      btn.disabled = false; btn.innerText = 'Pay securely →';
      if (init.alreadyPaid) { clearInterval(pollTimer); await finalizeAndAdvance_(); return; }
      FlutterwaveCheckout({
        public_key: init.publicKey, tx_ref: init.txRef, amount: init.amount, currency: init.currency,
        customer: { email: init.email }, customizations: { title: 'Humanly Review', description: state.plan.name },
        callback: async function(payment) {
          try {
            await hrCall('verifyPayment', { sessionToken: state.sessionToken, orderRef: state.orderRef, transactionId: payment.transaction_id, txRef: init.txRef });
            clearInterval(pollTimer);
            await finalizeAndAdvance_();
          } catch (e) { hrShowError(msg, e.message); }
        },
        onclose: function() {}
      });
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Pay securely →'; }
  };
}

/** Requirement #7: automatic, no extra clicks. This is what actually writes
 *  the file to Drive (requirement #5) now that payment is confirmed. */
async function finalizeAndAdvance_() {
  try {
    await hrCall('finalizeSubmission', { sessionToken: state.sessionToken, orderRef: state.orderRef, fileBase64: state.fileBase64 });
  } catch (e) { /* if already finalized this is a no-op */ }
  state.fileBase64 = ''; // no need to keep it in storage any longer
  goTo('submitted');
}

/* ---------------- Submitted (clickable reference — requirement #11) ---------------- */
function renderSubmitted() {
  app.innerHTML =
    '<div class="card center">' +
      '<h2>You\'re all set ✓</h2>' +
      '<p class="sub">Your reference number is (tap to copy):</p>' +
      '<div class="ref-number" id="refBox">' + hrEscape(state.orderRef) + ' 📋</div>' +
      '<div class="copy-toast" id="copyToast"></div>' +
      '<p class="sub" style="margin-top:16px;">We\'ve emailed you a receipt and tracking link. We\'ll email you again the moment your report is ready.</p>' +
      '<a class="btn" href="?view=track&order=' + encodeURIComponent(state.orderRef) + '">Track my submission →</a>' +
    '</div>';
  document.getElementById('refBox').onclick = function() { hrCopyToClipboard(state.orderRef, document.getElementById('copyToast')); };
  hrClearState(STATE_KEY);
}

/* ---------------- Tracking (with countdown — requirement #20) ---------------- */
async function renderTracking(orderRef) {
  app.innerHTML = '<div class="card center"><p class="muted">Loading your status…</p></div>';
  try {
    const res = await hrCall('getOrderStatus', { orderRef: orderRef });
    const labels = {
      awaiting_payment:'Awaiting payment', submitted:'Submitted — in queue', in_review:'Being reviewed by our team',
      delivered:'Report ready — link sent', downloaded:'Downloaded', acknowledged:'Confirmed received',
      deleted:'Complete — files deleted', abandoned_expired:'Expired (no payment received)'
    };
    let countdownHtml = '';
    if (res.dueAt && ['submitted','in_review'].indexOf(res.status) !== -1) {
      countdownHtml = '<div class="countdown" id="dueCountdown">--</div><p class="muted center">' + (siteSettings.delivery_time_message || 'Delivery time varies depending on document size and time of day.') + '</p>';
    }
    app.innerHTML =
      '<div class="card">' +
        '<h2>Order <span id="refCopy" style="cursor:pointer;">' + hrEscape(res.orderRef) + ' 📋</span></h2>' +
        '<div class="copy-toast" id="copyToast"></div>' +
        '<p class="badge wait">' + (labels[res.status] || res.status) + '</p>' +
        countdownHtml +
        '<ul class="checklist">' +
          '<li><span>Plan</span><span>' + hrEscape(res.planName || '—') + '</span></li>' +
          '<li><span>Price</span><span>' + (res.currency||'') + ' ' + (res.price ? Number(res.price).toLocaleString() : '—') + '</span></li>' +
        '</ul>' +
        '<a class="btn secondary" href="help.html?order=' + encodeURIComponent(res.orderRef) + '">Contact support about this order →</a>' +
        '<p class="muted" style="margin-top:10px;">This page always shows your real, current status — refresh any time.</p>' +
      '</div>';
    document.getElementById('refCopy').onclick = function() { hrCopyToClipboard(res.orderRef, document.getElementById('copyToast')); };
    if (res.dueAt) hrStartDueCountdown(document.getElementById('dueCountdown'), res.dueAt);
  } catch (e) {
    app.innerHTML = '<div class="card"><div class="error-box">' + hrEscape(e.message) + '</div></div>';
  }
}

(async function boot() {
  siteSettings = await hrApplyTheme();
  render();
})();
</script>
</body>
</html>
