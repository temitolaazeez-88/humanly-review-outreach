<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanly Review</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://checkout.flutterwave.com/v3.js"></script>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand" data-site-name>Humanly Review</a>
  <a href="help.html" class="muted" style="text-decoration:none;">Need help?</a>
</div>

<div class="wrap" id="app"></div>

<footer>
  <span data-site-name>Humanly Review</span> · Your document is kept private and deleted automatically after delivery.
  · <a href="help.html">Support</a>
</footer>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============================================================
   STATE
   ============================================================ */
const state = {
  step: 'landing',
  email: '', sessionToken: '', orderRef: '',
  plan: null, wordCount: 0, imageCount: 0, fileSizeMB: 0
};
const app = document.getElementById('app');
const STEPS = ['email','otp','upload','plan','payment','ready','submitted'];

function stepDots(current) {
  const idx = STEPS.indexOf(current);
  return '<div class="steps">' + STEPS.map(function(s,i){
    return '<div class="step-dot ' + (i <= idx ? 'done' : '') + '"></div>';
  }).join('') + '</div>';
}

/* ============================================================
   RENDER ROUTER
   ============================================================ */
function render() {
  const trackOrder = hrGetParam('order');
  if (hrGetParam('view') === 'track' && trackOrder) { return renderTracking(trackOrder); }

  switch (state.step) {
    case 'landing': return renderLanding();
    case 'email': return renderEmail();
    case 'otp': return renderOtp();
    case 'upload': return renderUpload();
    case 'plan': return renderPlan();
    case 'payment': return renderPayment();
    case 'ready': return renderReady();
    case 'submitted': return renderSubmitted();
  }
}

/* ---------------- Landing ---------------- */
function renderLanding() {
  app.innerHTML =
    '<div class="card center">' +
      '<h1 data-hero-title>Find the academic problems others may miss.</h1>' +
      '<p class="sub" data-hero-subtitle>Upload your document. Get a professional review, delivered securely.</p>' +
      '<button class="btn" id="startBtn" data-cta-text>Get My Review →</button>' +
    '</div>';
  document.getElementById('startBtn').onclick = function() { state.step = 'email'; render(); };
}

/* ---------------- Email entry ---------------- */
function renderEmail() {
  app.innerHTML =
    '<div class="card">' + stepDots('email') +
      '<h2>What\'s your email address?</h2>' +
      '<p class="sub">We\'ll send you a one-time 6-digit code — no password needed.</p>' +
      '<div id="msg"></div>' +
      '<input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">' +
      '<button class="btn" id="continueBtn" style="margin-top:10px;">Continue →</button>' +
    '</div>';

  document.getElementById('continueBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const email = document.getElementById('emailInput').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Sending code…';
    try {
      await hrCall('sendOtp', { email: email });
      state.email = email;
      state.step = 'otp';
      render();
    } catch (e) {
      hrShowError(msg, e.message);
      btn.disabled = false; btn.innerText = 'Continue →';
    }
  };
}

/* ---------------- OTP verification ---------------- */
function renderOtp() {
  app.innerHTML =
    '<div class="card">' + stepDots('otp') +
      '<h2>Enter your 6-digit code</h2>' +
      '<p class="sub">We sent a code to <strong>' + hrEscape(state.email) + '</strong>.</p>' +
      '<div id="msg"></div>' +
      '<input type="text" id="codeInput" placeholder="123456" maxlength="6" inputmode="numeric">' +
      '<button class="btn" id="verifyBtn" style="margin-top:10px;">Verify →</button>' +
      '<p class="muted center" style="margin-top:14px;"><a href="#" id="resendLink">Resend code</a> · <a href="#" id="backLink">Change email</a></p>' +
    '</div>';

  document.getElementById('backLink').onclick = function(e){ e.preventDefault(); state.step='email'; render(); };
  document.getElementById('resendLink').onclick = async function(e){
    e.preventDefault();
    try { await hrCall('sendOtp', { email: state.email }); hrShowSuccess(document.getElementById('msg'), 'A new code has been sent.'); }
    catch (err) { hrShowError(document.getElementById('msg'), err.message); }
  };
  document.getElementById('verifyBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const code = document.getElementById('codeInput').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…';
    try {
      const res = await hrCall('verifyOtp', { email: state.email, code: code });
      state.sessionToken = res.sessionToken;
      state.step = 'upload';
      render();
    } catch (e) {
      hrShowError(msg, e.message);
      btn.disabled = false; btn.innerText = 'Verify →';
    }
  };
}

/* ---------------- Document upload ---------------- */
function renderUpload() {
  app.innerHTML =
    '<div class="card">' + stepDots('upload') +
      '<h2>Upload your academic work</h2>' +
      '<p class="sub">Accepted formats: DOCX, TXT.</p>' +
      '<div id="msg"></div>' +
      '<input type="file" id="fileInput" accept=".docx,.txt">' +
      '<p class="help">Your plan and price are matched automatically from word count, image count and file size only — nothing else is read from your document.</p>' +
      '<button class="btn" id="uploadBtn" style="margin-top:10px;">Continue →</button>' +
    '</div>';

  document.getElementById('uploadBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const fileEl = document.getElementById('fileInput');
    if (!fileEl.files.length) { hrShowError(msg, 'Please choose a file first.'); return; }
    const file = fileEl.files[0];
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking your document…';
    try {
      const base64 = await fileToBase64(file);
      const res = await hrCall('uploadDocument', {
        sessionToken: state.sessionToken, fileName: file.name, fileBase64: base64
      });
      state.orderRef = res.orderRef; state.plan = res.plan;
      state.wordCount = res.wordCount; state.imageCount = res.imageCount; state.fileSizeMB = res.fileSizeMB;
      state.step = 'plan';
      render();
    } catch (e) {
      hrShowError(msg, e.message);
      btn.disabled = false; btn.innerText = 'Continue →';
    }
  };
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() { resolve(reader.result.split(',')[1]); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Plan match result ---------------- */
function renderPlan() {
  app.innerHTML =
    '<div class="card">' + stepDots('plan') +
      '<h2>' + hrEscape(state.plan.name) + ' — Eligible ✓</h2>' +
      '<ul class="checklist">' +
        '<li><span>Word count</span><span>' + state.wordCount + '</span></li>' +
        '<li><span>Images</span><span>' + state.imageCount + '</span></li>' +
        '<li><span>File size</span><span>' + state.fileSizeMB + ' MB</span></li>' +
        '<li><span>Price</span><span><strong>' + state.plan.currency + ' ' + Number(state.plan.price).toLocaleString() + '</strong></span></li>' +
      '</ul>' +
      '<button class="btn" id="payBtn">Continue to payment →</button>' +
    '</div>';
  document.getElementById('payBtn').onclick = function() { state.step = 'payment'; render(); };
}

/* ---------------- Payment ---------------- */
function renderPayment() {
  app.innerHTML =
    '<div class="card">' + stepDots('payment') +
      '<h2>Order summary</h2>' +
      '<ul class="checklist">' +
        '<li><span>Reference</span><span>' + hrEscape(state.orderRef) + '</span></li>' +
        '<li><span>Plan</span><span>' + hrEscape(state.plan.name) + '</span></li>' +
        '<li><span>Total</span><span><strong>' + state.plan.currency + ' ' + Number(state.plan.price).toLocaleString() + '</strong></span></li>' +
      '</ul>' +
      '<div id="msg"></div>' +
      '<button class="btn" id="payNowBtn">Pay securely →</button>' +
      '<p class="muted center" style="margin-top:10px;">Closing this page never loses your progress — come back any time to finish payment.</p>' +
    '</div>';

  document.getElementById('payNowBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Preparing payment…';
    try {
      const init = await hrCall('initPayment', { sessionToken: state.sessionToken, orderRef: state.orderRef });
      btn.disabled = false; btn.innerText = 'Pay securely →';
      FlutterwaveCheckout({
        public_key: init.publicKey,
        tx_ref: init.txRef,
        amount: init.amount,
        currency: init.currency,
        customer: { email: init.email },
        customizations: { title: 'Humanly Review', description: state.plan.name },
        callback: async function(payment) {
          try {
            await hrCall('verifyPayment', {
              sessionToken: state.sessionToken, orderRef: state.orderRef,
              transactionId: payment.transaction_id, txRef: init.txRef
            });
            state.step = 'submitted';
            render();
          } catch (e) { hrShowError(msg, e.message); }
        },
        onclose: function() {}
      });
    } catch (e) {
      hrShowError(msg, e.message);
      btn.disabled = false; btn.innerText = 'Pay securely →';
    }
  };
}

/* ---------------- Submitted / tracking ---------------- */
function renderSubmitted() {
  app.innerHTML =
    '<div class="card center">' +
      '<h2>You\'re all set ✓</h2>' +
      '<p class="sub">Your reference number is:</p>' +
      '<h1>' + hrEscape(state.orderRef) + '</h1>' +
      '<p class="sub">We\'ve emailed you a receipt and tracking link. We\'ll email you again the moment your report is ready.</p>' +
      '<a class="btn" href="?view=track&order=' + encodeURIComponent(state.orderRef) + '">Track my submission →</a>' +
    '</div>';
}

async function renderTracking(orderRef) {
  app.innerHTML = '<div class="card center"><p class="muted">Loading your status…</p></div>';
  try {
    const res = await hrCall('getOrderStatus', { orderRef: orderRef });
    const labels = {
      draft:'Draft', awaiting_payment:'Awaiting payment', submitted:'Submitted — being reviewed',
      delivered:'Report ready — link sent', downloaded:'Downloaded', acknowledged:'Confirmed received',
      deleted:'Complete — files deleted', abandoned_expired:'Expired (no payment received)'
    };
    app.innerHTML =
      '<div class="card">' +
        '<h2>Order ' + hrEscape(res.orderRef) + '</h2>' +
        '<p class="badge wait">' + (labels[res.status] || res.status) + '</p>' +
        '<ul class="checklist">' +
          '<li><span>Plan</span><span>' + hrEscape(res.planName || '—') + '</span></li>' +
          '<li><span>Price</span><span>' + (res.currency||'') + ' ' + (res.price ? Number(res.price).toLocaleString() : '—') + '</span></li>' +
        '</ul>' +
        '<p class="muted">This page always shows your real, current status — refresh any time.</p>' +
      '</div>';
  } catch (e) {
    app.innerHTML = '<div class="card"><div class="error-box">' + hrEscape(e.message) + '</div></div>';
  }
}

hrApplyTheme().then(render);
</script>
</body>
</html>
