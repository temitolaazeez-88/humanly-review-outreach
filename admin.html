<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Humanly Review</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .wrap{max-width:640px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0;}
  .tab{padding:9px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:.82rem;}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .detail-panel{background:#F7F6F1;border-radius:10px;padding:16px;margin-top:10px;}
  .kv{display:flex;flex-direction:column;gap:4px;font-size:.86rem;}
  .kv .kvrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:5px 0;}
  .kv .kvrow span:first-child{color:var(--text-secondary);}
  .logo-preview{max-width:160px;max-height:60px;display:block;margin:10px 0;border:1px solid var(--border);border-radius:8px;padding:6px;background:#fff;}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Admin</span>
  <a href="#" id="logoutLink" class="muted" style="text-decoration:none;display:none;">Log out</a>
</div>
<div class="wrap" id="app"></div>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
let ADMIN_KEY = sessionStorage.getItem('hr_admin_key') || '';
const app = document.getElementById('app');
const logoutLink = document.getElementById('logoutLink');

async function adminCall(action, payload) { return hrCall(action, Object.assign({}, payload, { adminKey: ADMIN_KEY })); }
logoutLink.onclick = function(e) { e.preventDefault(); ADMIN_KEY = ''; sessionStorage.removeItem('hr_admin_key'); logoutLink.style.display = 'none'; renderLogin(); };

function renderLogin() {
  app.innerHTML =
    '<div class="card"><h1>Admin sign-in</h1><p class="sub">Enter your admin key.</p><div id="msg"></div>' +
    '<input type="password" id="keyInput" placeholder="Your admin key"><button class="btn" id="loginBtn" style="margin-top:10px;">Sign in →</button></div>';
  document.getElementById('loginBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    ADMIN_KEY = document.getElementById('keyInput').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…';
    try { await adminCall('adminLogin', {}); sessionStorage.setItem('hr_admin_key', ADMIN_KEY); logoutLink.style.display = 'inline'; renderDashboard('queue'); }
    catch (e) { hrShowError(msg, 'That key was not recognized.'); btn.disabled = false; btn.innerText = 'Sign in →'; }
  };
}

/* Merged: Overview now IS the order list with drill-down (requirement:
 * "it should be only overview"). Orders tab removed. */
const TABS = [['queue','Queue'],['overview','Overview'],['inquiries','Inquiries'],
  ['settings','Settings'],['plans','Plans'],['branding','Branding'],['faqs','FAQs'],['samples','Samples'],['audit','Log']];

function renderDashboard(active) {
  app.innerHTML = '<div class="tabs">' + TABS.map(function(t){ return '<div class="tab ' + (t[0]===active?'active':'') + '" data-tab="' + t[0] + '">' + t[1] + '</div>'; }).join('') + '</div><div id="tabContent"></div>';
  document.querySelectorAll('[data-tab]').forEach(function(el){ el.onclick = function(){ renderDashboard(el.getAttribute('data-tab')); }; });
  const c = document.getElementById('tabContent');
  ({queue: renderQueue, overview: renderOverview, inquiries: renderInquiries, settings: renderSettings,
    plans: renderPlans, branding: renderBranding, faqs: renderFaqs, samples: renderSamples, audit: renderAudit}[active])(c);
}

/* ---------------- Upload queue ---------------- */
async function renderQueue(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading queue…</p></div>';
  const res = await adminCall('adminListOrders', {});
  const waiting = res.orders.filter(function(o){ return ['submitted','in_review'].indexOf(o.Status) !== -1; });
  c.innerHTML =
    '<div class="card"><h2>Waiting for your upload (' + waiting.length + ')</h2>' +
    (waiting.length === 0 ? '<p class="muted">Nothing waiting right now. 🎉</p>' :
      '<div class="admin-card-list">' + waiting.map(function(o) {
        const openedBadge = o.OriginalOpenedAt ? '<span class="badge ok">Opened</span>' : '<span class="badge warn">Not opened</span>';
        return '<div class="admin-entity-card">' +
          '<div class="row-top"><div><strong>' + hrEscape(o.OrderRef) + '</strong><br><span class="muted">' + hrEscape(o.PlanName) + ' · ' + o.FileSizeMB + 'MB</span></div>' + openedBadge + '</div>' +
          '<div class="btn-row" style="margin-top:12px;">' +
          '<button class="btn secondary small" data-open="' + o.OriginalFileId + '" data-ref="' + o.OrderRef + '" style="flex:1;">Open original</button>' +
          '<button class="btn small" data-upload="' + hrEscape(o.OrderRef) + '" style="flex:1;">Upload files</button></div>' +
        '</div>';
      }).join('') + '</div>') +
    '</div><div id="uploadModal"></div>';

  document.querySelectorAll('[data-open]').forEach(function(a) {
    a.onclick = async function() {
      const fileId = a.getAttribute('data-open'), ref = a.getAttribute('data-ref');
      try { await adminCall('adminMarkOpened', { orderRef: ref }); } catch (e) {}
      window.open('https://drive.google.com/file/d/' + fileId + '/view', '_blank');
      renderQueue(document.getElementById('tabContent'));
    };
  });
  document.querySelectorAll('[data-upload]').forEach(function(btn){ btn.onclick = function(){ renderUploadModal(btn.getAttribute('data-upload')); }; });
}

function renderUploadModal(orderRef) {
  const modal = document.getElementById('uploadModal');
  modal.innerHTML =
    '<div class="card"><h2>Upload finished files — ' + hrEscape(orderRef) + '</h2><div id="msg"></div>' +
    '<label>Finished file(s) — pick as many as you need</label><input type="file" id="filesInput" multiple>' +
    '<button class="btn" id="doUploadBtn" style="margin-top:10px;">Upload & deliver →</button></div>';
  document.getElementById('doUploadBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const filesEl = document.getElementById('filesInput');
    if (!filesEl.files.length) { hrShowError(msg, 'Please choose at least one file.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading & delivering…';
    try {
      const files = [];
      for (const f of filesEl.files) files.push({ name: f.name, base64: await fileToBase64(f) });
      await adminCall('adminUpload', { orderRef: orderRef, files: files });
      hrShowSuccess(msg, 'Delivered! Client emailed automatically.');
      setTimeout(function(){ renderDashboard('queue'); }, 1200);
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Upload & deliver →'; }
  };
}

/* ---------------- Overview = stats + full searchable/filterable/sortable order list ---------------- */
let ordersCache = [];
async function renderOverview(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  ordersCache = (await adminCall('adminListOrders', {})).orders;
  const settingsRes = await adminCall('adminGetSettings', {});
  const maintOn = String(settingsRes.settings.maintenance_mode) === 'true';
  const count = function(s){ return ordersCache.filter(function(o){ return o.Status === s; }).length; };

  c.innerHTML =
    '<div class="card"><h2>Snapshot</h2><ul class="checklist">' +
      '<li><span>Total orders</span><span>' + ordersCache.length + '</span></li>' +
      '<li><span>Awaiting payment</span><span>' + count('awaiting_payment') + '</span></li>' +
      '<li><span>Waiting on your upload</span><span>' + (count('submitted')+count('in_review')) + '</span></li>' +
      '<li><span>Delivered</span><span>' + count('delivered') + '</span></li>' +
      '<li><span>Completed</span><span>' + count('deleted') + '</span></li>' +
    '</ul>' +
    '<button class="btn ' + (maintOn ? 'danger' : 'secondary') + ' small" id="maintBtn">' + (maintOn ? 'Turn OFF maintenance mode' : 'Turn ON maintenance mode') + '</button>' +
    '</div>' +
    '<div class="card"><h2>All orders (' + ordersCache.length + ')</h2>' +
    '<input type="search" id="orderSearch" placeholder="Search reference, email, plan…">' +
    '<div class="filter-bar">' +
      '<select id="statusFilter"><option value="">All statuses</option>' +
        ['awaiting_payment','submitted','in_review','delivered','downloaded','acknowledged','deleted','abandoned_expired'].map(function(s){ return '<option value="' + s + '">' + s + '</option>'; }).join('') +
      '</select>' +
      '<select id="sortSelect">' +
        '<option value="urgent">Most urgent first</option><option value="newest">Newest first</option>' +
        '<option value="oldest">Oldest first</option><option value="status">By status</option>' +
      '</select>' +
    '</div>' +
    '<div class="admin-card-list" id="orderList"></div></div><div id="orderDetail"></div>';

  document.getElementById('maintBtn').onclick = async function() { await adminCall('adminToggleMaintenance', { enabled: !maintOn }); renderDashboard('overview'); };
  document.getElementById('orderSearch').oninput = drawOrderList;
  document.getElementById('statusFilter').onchange = drawOrderList;
  document.getElementById('sortSelect').onchange = drawOrderList;
  drawOrderList();
}

function timeLeftLabel_(dueAt) {
  if (!dueAt) return { text: '—', cls: '' };
  const diff = new Date(dueAt).getTime() - Date.now();
  if (diff <= 0) return { text: 'OVERDUE', cls: 'urgent' };
  const h = diff / 3600000;
  if (h < 6) return { text: Math.round(h) + 'h left', cls: 'urgent' };
  if (h < 24) return { text: Math.round(h) + 'h left', cls: 'soon' };
  return { text: Math.round(h/24) + 'd left', cls: 'ok' };
}

function drawOrderList() {
  const q = document.getElementById('orderSearch').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const sortBy = document.getElementById('sortSelect').value;
  let list = ordersCache.filter(function(o) {
    if (statusF && o.Status !== statusF) return false;
    if (q && JSON.stringify(o).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  list.sort(function(a, b) {
    if (sortBy === 'newest') return new Date(b.CreatedAt) - new Date(a.CreatedAt);
    if (sortBy === 'oldest') return new Date(a.CreatedAt) - new Date(b.CreatedAt);
    if (sortBy === 'status') return String(a.Status).localeCompare(String(b.Status));
    // urgent: soonest DueAt first, orders without a DueAt go last
    const ad = a.DueAt ? new Date(a.DueAt).getTime() : Infinity;
    const bd = b.DueAt ? new Date(b.DueAt).getTime() : Infinity;
    return ad - bd;
  });
  document.getElementById('orderList').innerHTML = list.map(function(o) {
    const tl = timeLeftLabel_(o.DueAt);
    return '<div class="admin-entity-card" data-row="' + hrEscape(o.OrderRef) + '">' +
      '<div class="row-top"><div><strong>' + hrEscape(o.OrderRef) + '</strong><br><span class="muted">' + hrEscape(o.ClientEmail) + '</span></div>' +
      (['submitted','in_review'].indexOf(o.Status) !== -1 ? '<span class="time-left ' + tl.cls + '">' + tl.text + '</span>' : '<span class="badge wait">' + hrEscape(o.Status) + '</span>') +
      '</div></div>';
  }).join('');
  document.querySelectorAll('[data-row]').forEach(function(el){ el.style.cursor = 'pointer'; el.onclick = function(){ showOrderDetail(el.getAttribute('data-row')); }; });
}

function showOrderDetail(orderRef) {
  const o = ordersCache.filter(function(x){ return x.OrderRef === orderRef; })[0];
  const panel = document.getElementById('orderDetail');
  panel.innerHTML =
    '<div class="card"><h2>' + hrEscape(o.OrderRef) + '</h2><div class="detail-panel"><div class="kv">' +
    Object.keys(o).map(function(k){ return '<div class="kvrow"><span>' + k + '</span><span>' + hrEscape(String(o[k])) + '</span></div>'; }).join('') +
    '</div></div>' +
    (o.PaymentStatus !== 'confirmed' ? '<button class="btn secondary small" id="waiveBtn" style="margin-top:12px;">Waive / approve payment</button>' : '') +
    ' <button class="btn ghost small" id="closeDetailBtn" style="margin-top:12px;">Close</button></div>';
  document.getElementById('closeDetailBtn').onclick = function() { panel.innerHTML = ''; };
  const waiveBtn = document.getElementById('waiveBtn');
  if (waiveBtn) waiveBtn.onclick = async function() {
    if (!confirm('Mark this order as paid for free?')) return;
    await adminCall('adminApprovePayment', { orderRef: o.OrderRef });
    renderOverview(document.getElementById('tabContent'));
  };
}

/* ---------------- Inquiries ---------------- */
async function renderInquiries(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetInquiries', {});
  const open = res.inquiries.filter(function(i){ return i.Status !== 'resolved'; });
  c.innerHTML = '<div class="card"><h2>Open tickets (' + open.length + ')</h2>' +
    (open.length === 0 ? '<p class="muted">Nothing open. ✅</p>' : '<div class="admin-card-list">' + open.map(renderInquiryCard_).join('') + '</div>') +
    '</div>' +
    '<div class="card"><h2>Resolved history</h2><div class="admin-card-list">' +
    res.inquiries.filter(function(i){ return i.Status === 'resolved'; }).slice(0,20).map(function(i){
      return '<div class="admin-entity-card"><div class="row-top"><span>' + hrEscape(i.TicketRef) + ' — ' + hrEscape(i.Category) + '</span><span class="badge ok">Resolved</span></div></div>';
    }).join('') + '</div></div>';

  document.querySelectorAll('[data-reply]').forEach(function(btn){
    btn.onclick = async function() {
      const id = btn.getAttribute('data-reply'); const box = document.getElementById('reply-' + id);
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Sending…';
      try { await adminCall('adminReplyInquiry', { inquiryId: id, replyMessage: box.value }); renderInquiries(document.getElementById('tabContent')); }
      catch (e) { alert(e.message); btn.disabled = false; btn.innerText = 'Send & resolve'; }
    };
  });
  document.querySelectorAll('[data-quote]').forEach(function(btn){
    btn.onclick = async function() {
      if (!confirm('Send an automatic custom quote?')) return;
      try { const r = await adminCall('adminQuoteOversized', { inquiryId: btn.getAttribute('data-quote') }); alert('Quote sent: ' + r.price); renderInquiries(document.getElementById('tabContent')); }
      catch (e) { alert(e.message); }
    };
  });
  document.querySelectorAll('[data-copy-claude]').forEach(function(btn){
    btn.onclick = function() {
      hrCopyToClipboard(decodeURIComponent(btn.getAttribute('data-copy-claude')), null);
      btn.innerText = 'Copied!'; setTimeout(function(){ btn.innerText = 'Copy for Claude'; }, 2000);
    };
  });
}
function renderInquiryCard_(i) {
  const claudePayload = 'SUPPORT TICKET\nTicketRef: ' + i.TicketRef + '\nCategory: ' + i.Category + '\nCustomer email: ' + i.Email +
    '\nOrder reference: ' + (i.OrderRef || 'none') + '\nMessage from customer:\n' + i.Message + '\n\nWrite a short, warm, professional reply as Humanly Review support. Keep it under 120 words.';
  return '<div class="admin-entity-card">' +
    '<strong>' + hrEscape(i.TicketRef) + '</strong> — ' + hrEscape(i.Category) + (i.Category === 'Oversized Request' ? ' <span class="badge warn">Oversized</span>' : '') +
    '<div class="muted">' + hrEscape(i.Email) + ' · ' + hrEscape(i.OrderRef || '—') + '</div>' +
    '<div style="margin:8px 0;">' + hrEscape(i.Message) + '</div>' +
    '<textarea id="reply-' + i.InquiryID + '" placeholder="Type or paste your reply…" rows="3"></textarea>' +
    '<div class="btn-row" style="margin-top:6px;flex-wrap:wrap;">' +
      '<button class="btn small secondary" data-copy-claude="' + encodeURIComponent(claudePayload) + '">Copy for Claude</button>' +
      '<button class="btn small" data-reply="' + i.InquiryID + '">Send & resolve</button>' +
      (i.Category === 'Oversized Request' ? '<button class="btn small secondary" data-quote="' + i.InquiryID + '">Auto quote</button>' : '') +
    '</div></div>';
}

/* ---------------- Settings ---------------- */
async function renderSettings(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetSettings', {});
  const s = res.settings;
  c.innerHTML = '<div class="card"><h2>Settings</h2><input type="search" id="settingsSearch" placeholder="Search settings…"><div id="msg"></div><div id="settingsList"></div>' +
    '<button class="btn" id="saveSettingsBtn" style="margin-top:14px;">Save all changes</button></div>';
  function draw(filter) {
    const keys = Object.keys(s).filter(function(k){ return !filter || k.toLowerCase().indexOf(filter) !== -1; });
    document.getElementById('settingsList').innerHTML = keys.map(function(k) { return '<label>' + hrEscape(k) + '</label><textarea class="admin-textarea-lg" data-key="' + k + '">' + hrEscape(s[k]) + '</textarea>'; }).join('');
  }
  draw('');
  document.getElementById('settingsSearch').oninput = function(){ draw(this.value.toLowerCase()); };
  document.getElementById('saveSettingsBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const updates = {}; document.querySelectorAll('[data-key]').forEach(function(el){ updates[el.getAttribute('data-key')] = el.value; });
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try { await adminCall('adminUpdateSettings', { settings: updates }); hrShowSuccess(msg, 'Saved.'); }
    catch (e) { hrShowError(msg, e.message); }
    btn.disabled = false; btn.innerText = 'Save all changes';
  };
}

/* ---------------- Plans: vertical cards, big inputs, real delete ---------------- */
let plansWorkingCopy = [];
async function renderPlans(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  plansWorkingCopy = (await adminCall('adminGetPlans', {})).plans;
  drawPlans(c);
}
function drawPlans(c) {
  c.innerHTML = '<div class="card"><h2>Plans (by file size)</h2><div id="msg"></div>' +
    '<div class="admin-card-list" id="plansList"></div>' +
    '<button class="btn secondary small" id="addPlanBtn" style="margin-top:12px;">+ Add plan</button> ' +
    '<button class="btn small" id="savePlansBtn" style="margin-top:12px;">Save all plans</button></div>';
  drawPlanCards_();
  document.getElementById('addPlanBtn').onclick = function() {
    plansWorkingCopy.push({PlanID:'NEW'+Date.now(),PlanName:'New Plan',MinSizeMB:0,MaxSizeMB:0,Price:0,Currency:'NGN',DeliveryHours:48,DestinationFolderId:'',Active:true});
    drawPlanCards_();
  };
  document.getElementById('savePlansBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    readPlanCardsIntoWorkingCopy_();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try { await adminCall('adminUpdatePlans', { plans: plansWorkingCopy }); hrShowSuccess(msg, 'Plans saved.'); }
    catch (e) { hrShowError(msg, e.message); }
    btn.disabled = false; btn.innerText = 'Save all plans';
  };
}
function drawPlanCards_() {
  document.getElementById('plansList').innerHTML = plansWorkingCopy.map(function(p, i) { return planCard_(p, i); }).join('');
  document.querySelectorAll('.plan-delete').forEach(function(btn) {
    btn.onclick = function() {
      if (!confirm('Delete this plan?')) return;
      readPlanCardsIntoWorkingCopy_();
      plansWorkingCopy.splice(Number(btn.getAttribute('data-i')), 1);
      drawPlanCards_();
    };
  });
}
function readPlanCardsIntoWorkingCopy_() {
  document.querySelectorAll('.plan-card-edit').forEach(function(card, i) {
    plansWorkingCopy[i] = {
      PlanID: card.querySelector('[data-f=PlanID]').value, PlanName: card.querySelector('[data-f=PlanName]').value,
      MinSizeMB: Number(card.querySelector('[data-f=MinSizeMB]').value) || 0, MaxSizeMB: Number(card.querySelector('[data-f=MaxSizeMB]').value) || 0,
      Price: Number(card.querySelector('[data-f=Price]').value) || 0, Currency: card.querySelector('[data-f=Currency]').value,
      DeliveryHours: Number(card.querySelector('[data-f=DeliveryHours]').value) || 0, DestinationFolderId: card.querySelector('[data-f=DestinationFolderId]').value,
      Active: card.querySelector('[data-f=Active]').checked
    };
  });
}
function planCard_(p, i) {
  return '<div class="admin-entity-card plan-card-edit">' +
    '<input data-f="PlanID" value="' + hrEscape(p.PlanID) + '" style="display:none;">' +
    '<label>Plan name</label><input data-f="PlanName" value="' + hrEscape(p.PlanName) + '">' +
    '<label>Minimum size (MB)</label><input type="text" inputmode="decimal" data-f="MinSizeMB" value="' + p.MinSizeMB + '">' +
    '<label>Maximum size (MB)</label><input type="text" inputmode="decimal" data-f="MaxSizeMB" value="' + p.MaxSizeMB + '">' +
    '<label>Price</label><input type="text" inputmode="decimal" data-f="Price" value="' + p.Price + '">' +
    '<label>Currency</label><input data-f="Currency" value="' + hrEscape(p.Currency) + '">' +
    '<label>Delivery time (hours)</label><input type="text" inputmode="decimal" data-f="DeliveryHours" value="' + p.DeliveryHours + '">' +
    '<label>Destination folder ID (optional)</label><input data-f="DestinationFolderId" value="' + hrEscape(p.DestinationFolderId||'') + '" placeholder="leave blank for default">' +
    '<label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:12px;"><input type="checkbox" style="width:auto;min-height:auto;" data-f="Active" ' + (p.Active === true || p.Active === 'true' || p.Active === 'TRUE' ? 'checked' : '') + '> Active (visible to customers)</label>' +
    '<button class="btn danger small plan-delete" data-i="' + i + '" style="margin-top:12px;">Delete this plan</button>' +
    '</div>';
}

/* ---------------- Branding: logo, slogan, video upload ---------------- */
async function renderBranding(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetSettings', {});
  const s = res.settings;
  c.innerHTML =
    '<div class="card"><h2>Logo</h2><div id="logoMsg"></div>' +
    (s.logo_url ? '<img class="logo-preview" src="' + s.logo_url + '">' : '<p class="muted">No logo uploaded yet.</p>') +
    '<input type="file" id="logoFile" accept="image/*"><button class="btn small" id="logoBtn" style="margin-top:8px;">Upload logo</button></div>' +
    '<div class="card"><h2>Slogan</h2><div id="sloganMsg"></div>' +
    '<input type="text" id="sloganInput" value="' + hrEscape(s.site_slogan||'') + '" placeholder="A short line shown under your headline">' +
    '<button class="btn small" id="sloganBtn" style="margin-top:8px;">Save slogan</button></div>' +
    '<div class="card"><h2>"How it works" video</h2><div id="videoMsg"></div>' +
    (s.how_it_works_video_file_id ? '<div class="video-embed"><iframe src="https://drive.google.com/file/d/' + s.how_it_works_video_file_id + '/preview"></iframe></div>' : '<p class="muted">No video uploaded yet.</p>') +
    '<p class="help">Upload a video file directly (up to ~45MB), or skip this and paste a YouTube link in Settings (how_it_works_video_url) instead.</p>' +
    '<input type="file" id="videoFile" accept="video/*"><button class="btn small" id="videoBtn" style="margin-top:8px;">Upload video</button></div>';

  document.getElementById('logoBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('logoMsg'), fileEl = document.getElementById('logoFile');
    if (!fileEl.files.length) { hrShowError(msg, 'Choose an image first.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading…';
    try {
      const f = fileEl.files[0]; const b64 = await fileToBase64(f);
      const up = await adminCall('adminUploadBrandAsset', { base64: b64, fileName: f.name, mimeType: f.type });
      await adminCall('adminUpdateSettings', { settings: { logo_url: up.url } });
      hrShowSuccess(msg, 'Logo updated — refresh your site to see it.');
      renderBranding(document.getElementById('tabContent'));
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Upload logo'; }
  };
  document.getElementById('sloganBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('sloganMsg');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try { await adminCall('adminUpdateSettings', { settings: { site_slogan: document.getElementById('sloganInput').value } }); hrShowSuccess(msg, 'Saved.'); }
    catch (e) { hrShowError(msg, e.message); }
    btn.disabled = false; btn.innerText = 'Save slogan';
  };
  document.getElementById('videoBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('videoMsg'), fileEl = document.getElementById('videoFile');
    if (!fileEl.files.length) { hrShowError(msg, 'Choose a video first.'); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Uploading (this can take a minute for video)…';
    try {
      const f = fileEl.files[0]; const b64 = await fileToBase64(f);
      const up = await adminCall('adminUploadBrandAsset', { base64: b64, fileName: f.name, mimeType: f.type });
      await adminCall('adminUpdateSettings', { settings: { how_it_works_video_file_id: up.fileId } });
      hrShowSuccess(msg, 'Video updated.');
      renderBranding(document.getElementById('tabContent'));
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Upload video'; }
  };
}

/* ---------------- FAQs ---------------- */
async function renderFaqs(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetFaqs', {});
  drawFaqs(c, res.faqs);
}
function drawFaqs(c, faqs) {
  c.innerHTML = '<div class="card"><h2>FAQs</h2><div id="msg"></div><div class="admin-card-list" id="faqRows">' + faqs.map(faqRow_).join('') + '</div>' +
    '<button class="btn secondary small" id="addFaqBtn" style="margin-top:10px;">+ Add FAQ</button> ' +
    '<button class="btn small" id="saveFaqBtn" style="margin-top:10px;">Save FAQs</button></div>';
  document.getElementById('addFaqBtn').onclick = function() { document.getElementById('faqRows').insertAdjacentHTML('beforeend', faqRow_({FaqID:'',Category:'General',Question:'',Answer:'',Active:true})); attachFaqRemovers_(); };
  attachFaqRemovers_();
  document.getElementById('saveFaqBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const faqs2 = Array.from(document.querySelectorAll('.faq-row')).map(function(row) { return { FaqID: row.querySelector('[data-f=FaqID]').value, Category: row.querySelector('[data-f=Category]').value, Question: row.querySelector('[data-f=Question]').value, Answer: row.querySelector('[data-f=Answer]').value, Active: true }; });
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try { await adminCall('adminUpdateFaqs', { faqs: faqs2 }); hrShowSuccess(msg, 'Saved.'); } catch (e) { hrShowError(msg, e.message); }
    btn.disabled = false; btn.innerText = 'Save FAQs';
  };
}
function faqRow_(f) {
  return '<div class="admin-entity-card faq-row">' +
    '<input data-f="FaqID" value="' + hrEscape(f.FaqID) + '" style="display:none;">' +
    '<label>Category</label><input data-f="Category" value="' + hrEscape(f.Category) + '">' +
    '<label>Question</label><input data-f="Question" value="' + hrEscape(f.Question) + '">' +
    '<label>Answer</label><textarea data-f="Answer">' + hrEscape(f.Answer) + '</textarea>' +
    '<button class="btn small danger faq-remove" style="margin-top:8px;">Delete this FAQ</button></div>';
}
function attachFaqRemovers_() { document.querySelectorAll('.faq-remove').forEach(function(btn){ btn.onclick = function(){ btn.closest('.faq-row').remove(); }; }); }

/* ---------------- Samples ---------------- */
async function renderSamples(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetSamples', {});
  c.innerHTML = '<div class="card"><h2>Sample reports</h2><div id="msg"></div><div class="admin-card-list" id="sampleRows">' + res.samples.map(sampleRow_).join('') + '</div>' +
    '<button class="btn secondary small" id="addSampleBtn" style="margin-top:10px;">+ Add sample</button> ' +
    '<button class="btn small" id="saveSamplesBtn" style="margin-top:10px;">Save samples</button></div>';
  document.getElementById('addSampleBtn').onclick = function() { document.getElementById('sampleRows').insertAdjacentHTML('beforeend', sampleRow_({SampleID:'',Title:'',Description:'',PreviewFileId:'',DownloadFileId:'',Active:true})); };
  document.getElementById('saveSamplesBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    const rows = Array.from(document.querySelectorAll('.sample-row'));
    for (const row of rows) {
      const pf = row.querySelector('[data-upload-preview]').files[0], df = row.querySelector('[data-upload-download]').files[0];
      if (pf) { const b64 = await fileToBase64(pf); const r = await adminCall('adminUploadSampleFile', { base64: b64, fileName: pf.name, mimeType: pf.type }); row.querySelector('[data-f=PreviewFileId]').value = r.fileId; }
      if (df) { const b64 = await fileToBase64(df); const r = await adminCall('adminUploadSampleFile', { base64: b64, fileName: df.name, mimeType: df.type }); row.querySelector('[data-f=DownloadFileId]').value = r.fileId; }
    }
    const samples2 = rows.map(function(row) { return { SampleID: row.querySelector('[data-f=SampleID]').value, Title: row.querySelector('[data-f=Title]').value, Description: row.querySelector('[data-f=Description]').value, PreviewFileId: row.querySelector('[data-f=PreviewFileId]').value, DownloadFileId: row.querySelector('[data-f=DownloadFileId]').value, Active: true }; });
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…';
    try { await adminCall('adminUpdateSamples', { samples: samples2 }); hrShowSuccess(msg, 'Saved.'); } catch (e) { hrShowError(msg, e.message); }
    btn.disabled = false; btn.innerText = 'Save samples';
  };
}
function sampleRow_(s) {
  return '<div class="admin-entity-card sample-row">' +
    '<input data-f="SampleID" value="' + hrEscape(s.SampleID) + '" style="display:none;">' +
    '<input data-f="PreviewFileId" value="' + hrEscape(s.PreviewFileId) + '" style="display:none;">' +
    '<input data-f="DownloadFileId" value="' + hrEscape(s.DownloadFileId) + '" style="display:none;">' +
    '<label>Title</label><input data-f="Title" value="' + hrEscape(s.Title) + '">' +
    '<label>Description</label><textarea data-f="Description">' + hrEscape(s.Description) + '</textarea>' +
    '<label>Preview file (upload to replace)</label><input type="file" data-upload-preview>' +
    '<label>Downloadable file (upload to replace)</label><input type="file" data-upload-download></div>';
}

/* ---------------- Audit log (cards, not a table) ---------------- */
async function renderAudit(c) {
  c.innerHTML = '<div class="card"><p class="muted">Loading…</p></div>';
  const res = await adminCall('adminGetAuditLog', {});
  c.innerHTML = '<div class="card"><h2>Recent activity</h2><div class="admin-card-list">' +
    res.log.map(function(l){ return '<div class="admin-entity-card"><div class="muted" style="font-size:.78rem;">' + new Date(l.Timestamp).toLocaleString() + '</div>' +
      '<strong>' + hrEscape(l.Action) + '</strong>' + (l.OrderRef ? ' — ' + hrEscape(l.OrderRef) : '') +
      '<div class="muted" style="margin-top:4px;">' + hrEscape(String(l.Detail).slice(0,140)) + '</div></div>'; }).join('') +
    '</div></div>';
}

(async function() {
  await hrApplyTheme();
  if (ADMIN_KEY) { try { await adminCall('adminLogin', {}); logoutLink.style.display = 'inline'; renderDashboard('queue'); return; } catch (e) { sessionStorage.removeItem('hr_admin_key'); ADMIN_KEY = ''; } }
  renderLogin();
})();
</script>
