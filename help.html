<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & Support — Humanly Review</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand" id="brandLink" data-site-name>Humanly Review</a>
</div>
<div class="wrap" id="app"></div>
<footer><span data-site-name>Humanly Review</span></footer>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const app = document.getElementById('app');
let settings = {};
let faqs = [];

const CATEGORIES = [
  'Document & submission','Payment','While my report is being prepared',
  'Receiving / opening my report','After confirming receipt','Enterprise / custom quote','General / other'
];

function knownContext_() {
  // Reuse whatever the main site already knows about this visitor, so we
  // never make them retype something we already have (requirement #12).
  const custState = hrLoadState('hr_customer_state') || {};
  return {
    email: custState.email || '',
    orderRef: hrGetParam('order') || custState.orderRef || '',
    verifiedEmail: sessionStorage.getItem('hr_support_email') || custState.email || ''
  };
}

async function boot() {
  const [settingsResult, faqsResult] = await Promise.all([
    hrApplyTheme(),
    hrCall('getFaqs', {}).catch(function(){ return { faqs: [] }; })
  ]);
  settings = settingsResult;
  faqs = faqsResult.faqs;

  const lockedTicket = hrGetParam('ticketRef');
  if (lockedTicket && hrGetParam('locked') === '1') return renderLockedTicket(lockedTicket);
  render();
}

function render() {
  const grouped = {};
  faqs.forEach(function(f) { (grouped[f.Category] = grouped[f.Category] || []).push(f); });

  app.innerHTML =
    '<div class="card"><h1>How can we help?</h1><p class="sub">Browse answers below — anyone can view these, no sign-in needed.</p></div>' +
    Object.keys(grouped).map(function(cat) {
      return '<div class="card"><h2>' + hrEscape(cat) + '</h2>' +
        grouped[cat].map(function(f, i) {
          return '<div class="faq-item"><div class="faq-q" data-toggle>' + hrEscape(f.Question) + '<span class="chev">▾</span></div>' +
            '<div class="faq-a">' + hrEscape(f.Answer) + '</div></div>';
        }).join('') + '</div>';
    }).join('') +
    '<div class="card" id="contactSection"></div>';

  document.querySelectorAll('[data-toggle]').forEach(function(q) {
    q.onclick = function() { q.parentElement.classList.toggle('open'); };
  });

  renderContactGate();
}

/* Requirement #13/#15: only a verified email unlocks the contact box;
 * FAQ browsing above needs nothing. */
function renderContactGate() {
  const ctx = knownContext_();
  const section = document.getElementById('contactSection');
  if (ctx.verifiedEmail) return renderContactForm(ctx.verifiedEmail, ctx.orderRef);

  section.innerHTML =
    '<h2>Still need help?</h2>' +
    '<p class="sub">Enter your email to unlock direct support — this is how we\'ll reply to you.</p>' +
    '<div id="gateMsg"></div>' +
    '<input type="email" id="gateEmail" value="' + hrEscape(ctx.email) + '" placeholder="you@example.com">' +
    '<button class="btn" id="gateBtn" style="margin-top:8px;">Continue →</button>';

  document.getElementById('gateBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('gateMsg');
    const email = document.getElementById('gateEmail').value.trim();
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…';
    try {
      const res = await hrCall('verifySupportEmail', { email: email });
      sessionStorage.setItem('hr_support_email', res.email);
      renderContactForm(res.email, ctx.orderRef);
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Continue →'; }
  };
}

function renderContactForm(email, orderRef) {
  const section = document.getElementById('contactSection');
  const charLimit = Number(settings.support_message_char_limit || 600);
  const knownOrder = !!orderRef;
  section.innerHTML =
    '<h2>Contact support</h2>' +
    '<p class="sub">Your email is confirmed — support is now visible for the rest of your visit.</p>' +
    '<div id="msg"></div>' +
    '<label>Your email</label><input type="email" id="ceEmail" value="' + hrEscape(email) + '" readonly>' +
    '<label>Order reference (if any)</label><input type="text" id="ceOrder" value="' + hrEscape(orderRef || '') + '" ' + (knownOrder ? 'readonly' : 'placeholder="HR-2026-8K4P2"') + '>' +
    '<label>What is this about?</label>' +
    '<select id="ceCategory">' + CATEGORIES.map(function(c){ return '<option>' + c + '</option>'; }).join('') + '</select>' +
    '<label>Your message</label>' +
    '<textarea id="ceMessage" maxlength="' + charLimit + '" placeholder="Tell us what happened…"></textarea>' +
    '<div class="char-count"><span id="ceCount">0</span> / ' + charLimit + '</div>' +
    '<button class="btn" id="ceSendBtn">Send</button>';

  const msgBox = document.getElementById('ceMessage');
  const countEl = document.getElementById('ceCount');
  msgBox.oninput = function() { countEl.innerText = msgBox.value.length; };

  document.getElementById('ceSendBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Sending…';
    try {
      const res = await hrCall('submitInquiry', {
        email: document.getElementById('ceEmail').value,
        orderRef: document.getElementById('ceOrder').value,
        category: document.getElementById('ceCategory').value,
        systemCheck: 'user-submitted',
        message: msgBox.value,
        ticketRef: sessionStorage.getItem('hr_last_ticket') || ''
      });
      sessionStorage.setItem('hr_last_ticket', res.ticketRef);
      section.innerHTML =
        '<h2>Received ✓</h2>' +
        '<p class="sub">Your ticket reference is <strong>' + hrEscape(res.ticketRef) + '</strong>.</p>' +
        '<p class="muted">We\'ve emailed you a confirmation — you don\'t need to send this again. We will reply to ' + hrEscape(email) + ' by email.</p>';
    } catch (e) { hrShowError(msg, e.message); btn.disabled = false; btn.innerText = 'Send'; }
  };
}

/* Requirement #23: the oversized/enterprise request view — fully locked,
 * nothing editable, just their existing code and its live status. */
async function renderLockedTicket(ticketRef) {
  app.innerHTML = '<div class="card center"><p class="muted">Loading your request…</p></div>';
  try {
    const res = await hrCall('getTicketStatus', { ticketRef: ticketRef });
    const first = res.messages[0];
    app.innerHTML =
      '<div class="card">' +
        '<h2>Your custom quote request</h2>' +
        '<p class="badge ' + (res.status === 'resolved' ? 'ok' : 'wait') + '">' + (res.status === 'resolved' ? 'Quote sent — check your email' : 'Waiting for our team') + '</p>' +
        '<label>Reference</label><input type="text" value="' + hrEscape(ticketRef) + '" readonly>' +
        '<label>Your request (auto-generated)</label><textarea readonly>' + hrEscape(first.Message) + '</textarea>' +
        '<p class="muted" style="margin-top:12px;">This is view-only — nothing to fill in. We\'ll email you directly. If nothing arrives within a day, <a href="help.html">contact general support</a>.</p>' +
      '</div>';
  } catch (e) {
    app.innerHTML = '<div class="card"><div class="error-box">' + hrEscape(e.message) + '</div></div>';
  }
}

boot();
</script>
</body>
</html>
