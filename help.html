<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help & Support | Humanly Review</title><meta name="description" content="Get help with Humanly Review orders, payments, uploads and secure report delivery."><meta name="robots" content="index,follow"><link rel="stylesheet" href="styles.css?v=20260917.1"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Humanly Review</a><nav class="navlinks"><a href="index.html">Home</a></nav></div></header><main><section class="section"><div class="container"><h1>Help & Support</h1><p class="muted">Start with the FAQ. If you still need help, tell us what happened and we will reply by email.</p><div class="grid-2"><div class="card pad"><h2>Frequently asked questions</h2><div id="faq-list">Loading…</div></div><div class="card pad"><h2>Contact support</h2><div id="support-step-email"><div class="field"><label for="support-email">Email address</label><input id="support-email" class="input" type="email" placeholder="you@example.com"></div><button id="support-start" class="btn">Continue</button><div id="support-email-error" class="notice danger hidden" style="margin-top:12px"></div></div><div id="support-form" class="hidden"><div class="field"><label for="category">What do you need help with?</label><select id="category" class="select"><option>Payment problem</option><option>Report not received</option><option>Download problem</option><option>Wrong file</option><option>Upload problem</option><option>Oversized document</option><option>Other</option></select></div><div class="field"><label for="order-ref">Order reference (optional)</label><input id="order-ref" class="input" placeholder="HR-..."></div><div class="field"><label for="message">What happened?</label><textarea id="message" class="textarea" maxlength="2000" placeholder="Tell us what you need help with."></textarea><div class="small muted" id="char-count">0 / 2000</div></div><button id="submit-support" class="btn">Send to support</button><div id="support-msg" class="notice hidden" style="margin-top:12px"></div></div></div></div></div></section></main><footer class="footer"><div class="container"><a href="index.html">Return to Humanly Review</a></div></footer><script src="common.js?v=20260917.1"></script><script>
let publicData=null,supportToken='';const $=id=>document.getElementById(id);
function renderFaq(){const f=$('faq-list'),items=publicData?.faqs||[];if(!items.length){f.innerHTML='<div class="notice">FAQ items have not been added yet.</div>';return;}f.innerHTML=items.map((x,i)=>`<div class="faq-item"><div class="faq-q" data-i="${i}">${hrEscape(x.Question)} <span style="float:right">+</span></div><div class="faq-a hidden" id="faq-a-${i}">${x.Answer}</div></div>`).join('');f.querySelectorAll('.faq-q').forEach(q=>q.onclick=()=>{const a=$('faq-a-'+q.dataset.i);a.classList.toggle('hidden');q.querySelector('span').textContent=a.classList.contains('hidden')?'+':'−';});}
(async function(){try{publicData=(await hrApi('getPublicConfig')).data;renderFaq();}catch(e){hrToast(e.message,'danger');}$('message').oninput=()=>{ $('char-count').textContent=`${$('message').value.length} / 2000`;};$('support-start').onclick=async()=>{const email=$('support-email').value.trim().toLowerCase();hrSetError($('support-email-error'),'');if(!hrValidateEmail(email)){hrSetError($('support-email-error'),'Enter a valid email address.');return;}try{const r=await hrApi('supportStart',{email});supportToken=r.data.supportToken;localStorage.setItem('hr_support_token',supportToken);localStorage.setItem('hr_support_email',email);$('support-step-email').classList.add('hidden');$('support-form').classList.remove('hidden');$('order-ref').value=localStorage.getItem('hr_order_ref')||'';}catch(e){hrSetError($('support-email-error'),e.message);}};$('submit-support').onclick=async()=>{const b=$('submit-support');hrSetBusy(b,true,'Sending…');const box=$('support-msg');hrSetError(box,'');try{const r=await hrApi('submitInquiry',{supportToken,category:$('category').value,orderRef:$('order-ref').value.trim(),message:$('message').value.trim()});box.className='notice success';box.innerHTML=`<strong>Message sent.</strong><br>Ticket: <strong>${hrEscape(r.data.ticketRef)}</strong><br>We emailed you an acknowledgement. Please do not resend the same message while the ticket is open.`;$('message').value='';}catch(e){box.className='notice danger';box.textContent=e.message;}finally{hrSetBusy(b,false);}}})();
</script></body></html>
