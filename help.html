<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help & Support — Humanly Review</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="topbar">
  <a href="index.html" class="brand" data-site-name>Humanly Review</a>
</div>
<div class="wrap" id="app"></div>
<footer><span data-site-name>Humanly Review</span></footer>

<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const app = document.getElementById('app');

const CATEGORIES = {
  'Document & submission': ['Wrong document', 'Upload keeps failing', 'Already have an order in progress', 'Add a second document'],
  'Payment': ['Payment failed', 'Charged but no confirmation', 'Wrong amount charged', 'Duplicate payment', 'Lost my receipt', 'Payment stuck pending'],
  'While my report is being prepared': ['How long will it take?', 'Has my order been received?', 'Why haven\'t I heard anything?', 'Cancel order', 'Add instructions'],
  'Receiving / opening my report': ['Delivery email never arrived', 'Email in spam', 'Wrong email used', 'This link has expired', 'This link is invalid', 'Page won\'t load', 'PDF won\'t open', 'DOCX won\'t open', 'File looks corrupted', 'Wrong file delivered'],
  'After confirming receipt': ['Confused about the confirmation checkbox', 'Confirmed too early', 'Want to re-download before confirming', 'Re-send after deletion', 'Confused why files were deleted'],
  'General': ['What is this service?', 'How much does it cost?', 'Refund / cancellation policy', 'Is my document confidential?', 'Phishing concern', 'Something else']
};

const AUTO_ANSWERS = {
  'How long will it take?': 'Delivery time depends on your plan and is shown on your tracking page — most orders are completed within 48–96 hours of payment.',
  'Has my order been received?': 'If you have a reference number, use "Track my submission" on the homepage to see your live status.',
  'Email in spam': 'Please check your spam/junk folder, mark the email "not spam," and add our address to your contacts so future emails arrive normally.',
  'PDF won\'t open': 'Confirm the download finished fully, then try opening it in a different PDF reader or re-downloading from your delivery page.',
  'DOCX won\'t open': 'Open it with Microsoft Word or Google Docs, and confirm the file extension wasn\'t changed when saving. Try re-downloading if needed.',
  'What is this service?': 'We review academic documents and deliver a professional report as DOCX and PDF, matched automatically to a plan based on your document\'s size.',
  'How much does it cost?': 'Pricing depends on your document\'s word count, image count and file size, and is shown automatically before you pay — no surprises.',
  'Is my document confidential?': 'Yes. Files are stored privately, never publicly linked, and are automatically deleted once you confirm receipt or after a short retention window.',
  'Confused about the confirmation checkbox': 'Confirming means you have downloaded AND opened your report. It permanently deletes the files from our system for your privacy — this cannot be undone.',
  'Want to re-download before confirming': 'You can download as many times as you like — the buttons stay active until you actually confirm receipt.',
  'Confused why files were deleted': 'Files are removed automatically after confirmation (or after the retention window) to protect your confidentiality — this is expected behaviour, not an error.',
  'This link has expired': 'If your order is still active, a fresh link is generated and sent to you automatically — just check your email again in a moment, or use "Lost your link" below.',
  'Refund / cancellation policy': 'General policy: cancellations before your report is uploaded are handled personally by our team. Contact us with your reference number for your specific case.'
};

function render() {
  app.innerHTML =
    '<div class="card"><h1>How can we help?</h1>' +
    '<p class="sub">Choose the option closest to your situation.</p></div>' +
    Object.keys(CATEGORIES).map(function(group) {
      return '<div class="card"><h2>' + group + '</h2>' +
        CATEGORIES[group].map(function(item) {
          return '<button class="btn secondary" style="margin-bottom:8px;" data-item="' + hrEscape(item) + '">' + hrEscape(item) + '</button>';
        }).join('') + '</div>';
    }).join('');

  document.querySelectorAll('[data-item]').forEach(function(btn) {
    btn.onclick = function() { renderDetail(btn.getAttribute('data-item')); };
  });
}

function renderDetail(item) {
  const auto = AUTO_ANSWERS[item];
  app.innerHTML =
    '<div class="card">' +
      '<h2>' + hrEscape(item) + '</h2>' +
      (auto ? '<div class="success-box">' + hrEscape(auto) + '</div><p class="muted">Still need help with this? You can still send us a note below.</p>'
            : '<div class="info-box">This needs a quick look from our team — tell us a bit more and we\'ll follow up personally.</div>') +
      '<div id="msg"></div>' +
      '<label>Your email</label><input type="email" id="email" placeholder="you@example.com">' +
      '<label>Order reference (if you have one)</label><input type="text" id="orderRef" placeholder="HR-2026-8K4P2">' +
      '<label>Anything else to add?</label><textarea id="message" rows="3" placeholder="Optional — add any detail that helps us."></textarea>' +
      '<button class="btn" id="sendBtn" style="margin-top:10px;">Send</button>' +
      '<p class="center" style="margin-top:14px;"><a href="#" id="backBtn">← Back to all topics</a></p>' +
    '</div>';

  document.getElementById('backBtn').onclick = function(e){ e.preventDefault(); render(); };
  document.getElementById('sendBtn').onclick = async function() {
    const btn = this, msg = document.getElementById('msg');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Sending…';
    try {
      const res = await hrCall('submitInquiry', {
        email: document.getElementById('email').value,
        orderRef: document.getElementById('orderRef').value,
        category: item,
        systemCheck: auto ? 'auto-answered' : 'needs-review',
        message: document.getElementById('message').value
      });
      app.innerHTML = '<div class="card center"><h2>Received ✓</h2>' +
        '<p class="sub">Your reference is <strong>' + hrEscape(res.inquiryId) + '</strong>.</p>' +
        '<p class="muted">' + (res.escalated ? 'Our team will follow up personally by email.' : 'This has been logged — reply to any of our emails if you need more help.') + '</p>' +
        '<a class="btn secondary" href="help.html">Back to help</a></div>';
    } catch (e) {
      hrShowError(msg, e.message);
      btn.disabled = false; btn.innerText = 'Send';
    }
  };
}

hrApplyTheme().then(render);
</script>
</body>
</html>
