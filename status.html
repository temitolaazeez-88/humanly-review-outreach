<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status - Humanly Review</title><link rel="stylesheet" href="styles.css"><style>.status-card{max-width:720px;margin:40px auto}.status-hero{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.status-awaiting{background:#fff7ed;color:#9a3412}.status-submitted{background:#eff6ff;color:#1d4ed8}.status-review{background:#eef2ff;color:#4338ca}.status-ready{background:#ecfdf5;color:#166534}.status-done{background:#f1f5f9;color:#475569}.muted-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.status-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb}.status-row:last-child{border-bottom:0}.hidden{display:none!important}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Humanly Review</a><nav class="navlinks"><a href="index.html">New review</a><a href="help.html">Help</a></nav></div></header><main><section class="section"><div class="container"><div class="card pad status-card"><div id="verify-view"><h1>Check your order status</h1><p class="muted">Enter the email address used for your order. We will send a 6-digit verification code. You will not be charged.</p><div class="field"><label for="email">Email address</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div><div id="email-error" class="notice danger hidden"></div><button type="button" id="send-code" class="btn">Send verification code</button><div id="otp-area" class="hidden" style="margin-top:18px"><div class="field"><label for="otp">6-digit code</label><input id="otp" class="input" inputmode="numeric" maxlength="6" placeholder="123456"></div><div id="otp-error" class="notice danger hidden"></div><div class="actions"><button type="button" id="verify-code" class="btn">View order</button><button type="button" id="resend-code" class="btn secondary">Resend code</button></div></div></div><div id="status-view" class="hidden"><div class="status-hero"><div><div class="small muted">Order</div><h1 id="order-ref" style="margin:4px 0 0">—</h1></div><div id="status-pill" class="status-pill status-submitted">—</div></div><div id="status-message" class="muted-box" style="margin-top:18px"></div><div id="status-details" style="margin-top:18px"></div><div class="actions" style="margin-top:20px"><a class="btn secondary" href="index.html">Back to Humanly Review</a><a class="btn secondary" href="help.html">Help & Support</a></div></div></div></div></section></main><script src="common.js"></script><script>
const $=id=>document.getElementById(id);let orderRef=new URLSearchParams(location.search).get('order')||localStorage.getItem('hr_order_ref')||'',pending='',email='';function statusClass(s){return {awaiting_payment:'status-awaiting',submitted:'status-submitted',in_review:'status-review',delivered:'status-ready',downloaded:'status-ready',acknowledged:'status-done',deleted:'status-done'}[s]||'status-submitted';}function statusText(s){return {awaiting_payment:'Awaiting payment',submitted:'Submitted for review',in_review:'In review',delivered:'Report ready',downloaded:'Downloaded',acknowledged:'Receipt acknowledged',deleted:'Completed'}[s]||s||'Unknown';}function statusMessage(o){switch(o.status){case 'awaiting_payment':return 'Payment has not been confirmed for this order yet.';case 'submitted':return 'Your payment is confirmed and your files are securely in the review queue.';case 'in_review':return 'Your work has been opened by the reviewer and is currently being reviewed.';case 'delivered':return 'Your reviewed report is ready. Check your email for the secure delivery link.';case 'downloaded':return 'Your report has been downloaded. Please confirm receipt from the delivery page when ready.';case 'acknowledged':return 'You confirmed receipt of the delivered report.';case 'deleted':return 'This order is completed and its stored files have been removed.';default:return 'Your order status is shown below.';}}function renderOrder(o){$('verify-view').classList.add('hidden');$('status-view').classList.remove('hidden');$('order-ref').textContent=o.orderRef||orderRef;const pill=$('status-pill');pill.textContent=statusText(o.status);pill.className='status-pill '+statusClass(o.status);$('status-message').textContent=statusMessage(o);$('status-details').innerHTML=`<div class="card pad"><div class="status-row"><span>Plan</span><strong>${hrEscape(o.planName||'—')}</strong></div><div class="status-row"><span>Price</span><strong>${hrFormatMoney(o.price,o.currency)}</strong></div><div class="status-row"><span>Work files</span><strong>${Number(o.workFileCount||0)}</strong></div><div class="status-row"><span>Total Work size</span><strong>${hrFormatBytes(Number(o.workTotalBytes||0))}</strong></div><div class="status-row"><span>Payment</span><strong>${o.paymentStatus==='successful'?'Confirmed':'Not confirmed'}</strong></div><div class="status-row"><span>Expected delivery</span><strong>${o.dueAt?hrFormatDate(o.dueAt):'Shown after payment'}</strong></div></div>`;}async function loadOrder(){try{const r=await hrApi('getOrderStatus',{sessionToken:hrState.sessionToken,orderRef});renderOrder(r.data);}catch(e){if(String(e.message||'').toLowerCase().includes('session has expired')||!hrState.sessionToken){$('verify-view').classList.remove('hidden');}else{hrSetError($('email-error'),e.message);}}}async function sendCode(){email=$('email').value.trim().toLowerCase();hrSetError($('email-error'),'');if(!hrValidateEmail(email)){hrSetError($('email-error'),'Enter a valid email address.');return;}const b=$('send-code');hrSetBusy(b,true,'Sending code…');try{const r=await hrApi('requestOtp',{email,orderRef});pending=r.data.pendingSessionToken;hrSaveSession(pending,email);$('otp-area').classList.remove('hidden');$('otp').focus();startTimer(r.data.resendAfterSeconds);}catch(e){hrSetError($('email-error'),e.message);}finally{hrSetBusy(b,false);}}let timer;function startTimer(sec){clearInterval(timer);let n=Number(sec||0);$('resend-code').disabled=n>0;timer=setInterval(()=>{n--;$('resend-code').disabled=n>0;if(n<=0)clearInterval(timer);},1000);}async function verifyCode(){const code=$('otp').value.trim();hrSetError($('otp-error'),'');if(!/^\d{6}$/.test(code)){hrSetError($('otp-error'),'Enter the 6-digit code.');return;}const b=$('verify-code');hrSetBusy(b,true,'Loading…');try{const r=await hrApi('verifyOtp',{pendingSessionToken:pending,code});hrSaveSession(r.data.sessionToken,r.data.email);await loadOrder();}catch(e){hrSetError($('otp-error'),e.message);}finally{hrSetBusy(b,false);}}$('send-code').onclick=sendCode;$('verify-code').onclick=verifyCode;$('resend-code').onclick=sendCode;(async()=>{if(hrState.sessionToken&&orderRef){await loadOrder();}})();</script></body></html>
