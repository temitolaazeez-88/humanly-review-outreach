<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status - Humanly Review</title><link rel="stylesheet" href="styles.css?v=20260917.1"><style>.status-card{max-width:720px;margin:40px auto}.status-hero{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.status-awaiting{background:#fff7ed;color:#9a3412}.status-submitted{background:#eff6ff;color:#1d4ed8}.status-review{background:#eef2ff;color:#4338ca}.status-ready{background:#ecfdf5;color:#166534}.status-done{background:#f1f5f9;color:#475569}.muted-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px}.status-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #e5e7eb}.status-row:last-child{border-bottom:0}.hidden{display:none!important}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html">Humanly Review</a><nav class="navlinks"><a href="index.html">New review</a><a href="help.html">Help</a></nav></div></header><main><section class="section"><div class="container"><div class="card pad status-card"><div id="verify-view"><h1>Check your order status</h1><p class="muted">Enter the email address used for your order. We will send a 6-digit verification code. You will not be charged.</p><div class="field"><label for="email">Email address</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div><div id="email-error" class="notice danger hidden"></div><button type="button" id="send-code" class="btn">Send verification code</button><div id="otp-area" class="hidden" style="margin-top:18px"><div class="field"><label for="otp">6-digit code</label><input id="otp" class="input" inputmode="numeric" maxlength="6" placeholder="123456"></div><div id="otp-error" class="notice danger hidden"></div><div class="actions"><button type="button" id="verify-code" class="btn">View order</button><button type="button" id="resend-code" class="btn secondary">Resend code</button></div></div></div><div id="status-view" class="hidden"><div class="status-hero"><div><div class="small muted">Order</div><h1 id="order-ref" style="margin:4px 0 0">—</h1></div><div id="status-pill" class="status-pill status-submitted">—</div></div><div id="status-message" class="muted-box" style="margin-top:18px"></div><div id="status-details" style="margin-top:18px"></div><div class="actions" style="margin-top:20px"><button type="button" id="refresh-status" class="btn secondary">Refresh status</button><a class="btn secondary" href="index.html">Back to Humanly Review</a><a class="btn secondary" href="help.html">Help & Support</a></div></div><div id="custom-view" class="hidden"><div class="status-hero"><div><div class="small muted">Custom request</div><h1 id="ticket-ref" style="margin:4px 0 0">—</h1></div><div id="ticket-pill" class="status-pill status-submitted">—</div></div><div id="ticket-message" class="muted-box" style="margin-top:18px"></div><div id="ticket-details" style="margin-top:18px"></div><div class="actions" style="margin-top:20px"><button type="button" id="refresh-custom" class="btn secondary">Refresh</button><a class="btn" id="continue-custom" href="index.html">Continue with this request</a><a class="btn secondary" href="help.html">Help & Support</a></div></div></div></div></section></main><script src="common.js?v=20260917.1"></script><script>let mode='order',verifiedSession='';const $=id=>document.getElementById(id);const q=hrGetQuery();
function statusClass(s){return ({awaiting_payment:'status-awaiting',submitted:'status-submitted',in_review:'status-review',delivered:'status-ready',downloaded:'status-ready',acknowledged:'status-done',deleted:'status-done',abandoned_expired:'status-done'})[s]||'status-submitted';}
function statusText(s){return hrStatusLabel(s);}
function statusMessage(s){const m={awaiting_payment:'Payment is still pending. No payment is confirmed until Flutterwave verification succeeds.',submitted:'Your files have been received and are waiting for human review.',in_review:'Your work is currently being reviewed.',delivered:'Your reviewed report is ready for secure download.',downloaded:'Your report has been downloaded. You can complete the receipt confirmation when you are satisfied with the files.',acknowledged:'Your receipt has been recorded.',deleted:'This order is complete and stored customer files have been removed.',abandoned_expired:'This unpaid order has expired.'};return m[s]||'Your order is being processed.';}
function renderOrder(o){startRefresh();$('verify-view').classList.add('hidden');$('status-view').classList.remove('hidden');$('order-ref').textContent=o.orderRef;$('status-pill').textContent=statusText(o.status);$('status-pill').className='status-pill '+statusClass(o.status);$('status-message').textContent=statusMessage(o.status);$('status-details').innerHTML=`<div class="status-row"><span>Customer email</span><strong>${hrEscape(hrMaskEmail(o.email||''))}</strong></div><div class="status-row"><span>Work files</span><strong>${Number(o.workFileCount||0)}</strong></div><div class="status-row"><span>Work size</span><strong>${hrFormatBytes(o.workTotalBytes)}</strong></div><div class="status-row"><span>Plan</span><strong>${hrEscape(o.planName||'—')}</strong></div><div class="status-row"><span>Payment</span><strong>${o.paymentStatus==='successful'?'Confirmed':'Not confirmed'}</strong></div><div class="status-row"><span>Expected delivery</span><strong>${hrFormatDate(o.dueAt)}</strong></div>`;}
function renderCustom(x){startRefresh();$('verify-view').classList.add('hidden');$('status-view').classList.add('hidden');$('custom-view').classList.remove('hidden');$('ticket-ref').textContent=x.ticketRef;$('ticket-pill').textContent=x.status==='Open'?(x.quoteSentAt?'Quote ready':'Request received'):x.status;$('ticket-pill').className='status-pill '+(x.status==='Open'?'status-submitted':'status-done');$('ticket-message').innerHTML=x.quotePrice>0?`<strong>Your custom quote is ready.</strong><br>No payment has been taken yet. Review the quote below, then continue with the same Work files to proceed to payment.`:`<strong>Your custom request has been received.</strong><br>No payment has been taken yet. We will email you when the quote is ready.`;$('ticket-details').innerHTML=`<div class="status-row"><span>Request</span><strong>${hrEscape(x.ticketRef)}</strong></div><div class="status-row"><span>Work size</span><strong>${Number(x.requestWorkTotalMB||0).toFixed(2)} MB</strong></div><div class="status-row"><span>Quote</span><strong>${x.quotePrice>0?hrFormatMoney(x.quotePrice,x.quoteCurrency):'Not set yet'}</strong></div><div class="status-row"><span>Estimated review time</span><strong>${x.quoteDeliveryHours?Number(x.quoteDeliveryHours)+' hours':'Will be confirmed with quote'}</strong></div>`;$('continue-custom').href=`index.html?custom=${encodeURIComponent(x.ticketRef)}`;$('continue-custom').textContent=x.quotePrice>0?'Continue to payment':'Return to Humanly Review';}
async function loadOrder(){try{const orderRef=q.get('order');if(!orderRef)throw new Error('Order reference missing.');const r=await hrApi('getOrderStatus',{sessionToken:verifiedSession,orderRef},{noRetry:true});renderOrder(r.data);}catch(e){$('email-error').textContent=e.message;$('email-error').classList.remove('hidden');}}
async function loadCustom(){try{const ticketRef=q.get('ticket');if(!ticketRef)throw new Error('Request reference missing.');const r=await hrApi('getCustomRequestStatus',{sessionToken:verifiedSession,ticketRef},{noRetry:true});renderCustom(r.data);}catch(e){$('email-error').textContent=e.message;$('email-error').classList.remove('hidden');}}
let refreshTimer=null;
async function refreshCurrent(){
  if(!verifiedSession)return;
  try{
    if(mode==='order'){
      const ref=q.get('order')||localStorage.getItem('hr_order_ref');
      if(!ref)return;
      const r=await hrApi('getOrderStatus',{sessionToken:verifiedSession,orderRef:ref},{timeoutMs:20000,noRetry:true});
      renderOrder(r.data);
    }else{
      const ticket=q.get('ticket')||localStorage.getItem('hr_custom_ticket');
      if(!ticket)return;
      const r=await hrApi('getCustomRequestStatus',{sessionToken:verifiedSession,ticketRef:ticket},{timeoutMs:20000,noRetry:true});
      renderCustom(r.data);
    }
  }catch(e){console.error('Status refresh',e);}
}
function startRefresh(){clearInterval(refreshTimer);refreshTimer=setInterval(refreshCurrent,20000);}
async function sendCode(){const email=$('email').value.trim();$('email-error').classList.add('hidden');if(!hrValidateEmail(email)){ $('email-error').textContent='Enter a valid email address.';$('email-error').classList.remove('hidden');return;}const b=$('send-code');hrSetBusy(b,true,'Sending code…');try{const r=await hrApi('requestOtp',{email,orderRef:q.get('order')||'',ticketRef:q.get('ticket')||''});verifiedSession=r.data.pendingSessionToken;$('otp-area').classList.remove('hidden');$('otp').value='';$('otp').focus();startTimer(r.data.resendAfterSeconds);}catch(e){$('email-error').textContent=e.message;$('email-error').classList.remove('hidden');}finally{hrSetBusy(b,false);}}
function startTimer(sec){if(window.statusTimer)clearInterval(window.statusTimer);let n=Number(sec||0);const render=()=>{$('resend-code').disabled=n>0;$('resend-code').textContent=n>0?`Resend (${n}s)`:'Resend code';};render();window.statusTimer=setInterval(()=>{n--;render();if(n<=0)clearInterval(window.statusTimer);},1000);}
async function verifyCode(){const code=$('otp').value.trim();$('otp-error').classList.add('hidden');if(!/^\d{6}$/.test(code)){ $('otp-error').textContent='Enter the 6-digit code.';$('otp-error').classList.remove('hidden');return;}const b=$('verify-code');hrSetBusy(b,true,'Checking…');try{const r=await hrApi('verifyOtp',{pendingSessionToken:verifiedSession,code},{noRetry:true});hrSaveSession(r.data.sessionToken,r.data.email);verifiedSession=r.data.sessionToken;if(mode==='custom')await loadCustom();else await loadOrder();}catch(e){$('otp-error').textContent=e.message;$('otp-error').classList.remove('hidden');}finally{hrSetBusy(b,false);}}
$('send-code').onclick=sendCode;$('verify-code').onclick=verifyCode;$('refresh-status').onclick=refreshCurrent;if($('refresh-custom'))$('refresh-custom').onclick=refreshCurrent;$('resend-code').onclick=sendCode;mode=q.get('ticket')?'custom':'order';if(mode==='order'&&!q.get('order')){$('email-error').textContent='Open this page from your order status link or include an order reference.';$('email-error').classList.remove('hidden');}</script></body></html>
